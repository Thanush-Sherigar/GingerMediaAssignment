version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: media_pipeline_db
    environment:
      POSTGRES_DB: mediadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: media_pipeline_queue
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI dashboard port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gingermedia-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mediadb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - ../uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: gingermedia-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: gingermedia-worker:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mediadb
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ../uploads:/app/uploads
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
